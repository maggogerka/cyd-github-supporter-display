name: PlatformIO build

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.19
      - name: Reject committed Wi-Fi secrets
        run: test ! -e include/secrets.h
      - name: Build firmware
        run: pio run -e cyd
      - name: Run host-side tests
        run: pio test -e native
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyd-github-supporter-display-${{ github.sha }}
          path: .pio/build/cyd/firmware.bin
          if-no-files-found: error
