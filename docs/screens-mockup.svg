<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="350" viewBox="0 0 1040 350" role="img" aria-labelledby="title">
  <title id="title">Макеты экранов загрузки, подписчика и offline</title>
  <rect width="1040" height="350" fill="#ffffff"/>
  <g transform="translate(20 28)">
    <rect width="320" height="240" rx="8" fill="#0d1117"/>
    <rect x="12" y="18" width="296" height="204" rx="12" fill="#161b22"/>
    <text x="160" y="62" text-anchor="middle" font-family="Arial" font-size="20" fill="#f0f6fc">GitHub Supporter Display</text>
    <text x="160" y="91" text-anchor="middle" font-family="Arial" font-size="16" fill="#2f81f7">@maggogerka</text>
    <rect x="34" y="116" width="252" height="18" rx="9" fill="none" stroke="#8b949e"/>
    <rect x="37" y="119" width="183" height="12" rx="6" fill="#3fb950"/>
    <text x="160" y="168" text-anchor="middle" font-family="Arial" font-size="15" fill="#f0f6fc">Syncing time</text>
  </g>
  <g transform="translate(360 28)">
    <rect width="320" height="240" rx="8" fill="#0d1117"/>
    <text x="10" y="22" font-family="Arial" font-size="13" fill="#f0f6fc">@maggogerka supporters</text>
    <rect x="8" y="31" width="304" height="169" rx="12" fill="#161b22"/>
    <rect x="18" y="45" width="96" height="96" rx="10" fill="#0d1117" stroke="#2f81f7"/>
    <circle cx="66" cy="78" r="13" fill="#2f81f7"/>
    <path d="M36 125c6-34 54-34 60 0" fill="#2f81f7"/>
    <text x="126" y="68" font-family="Arial" font-size="21" fill="#f0f6fc">Follower Name</text>
    <text x="126" y="91" font-family="Arial" font-size="14" fill="#2f81f7">@login</text>
    <text x="126" y="112" font-family="Arial" font-size="12" fill="#8b949e">github.com/login</text>
    <text x="126" y="162" font-family="Arial" font-size="12" fill="#f0f6fc">THANK YOU FOR FOLLOWING!</text>
    <text x="160" y="188" text-anchor="middle" font-family="Arial" font-size="11" fill="#8b949e">Thank you for supporting my projects!</text>
    <text x="10" y="229" font-family="Arial" font-size="11" fill="#8b949e">Updated 24.07 18:40</text>
  </g>
  <g transform="translate(700 28)">
    <rect width="320" height="240" rx="8" fill="#0d1117"/>
    <text x="10" y="22" font-family="Arial" font-size="13" fill="#f0f6fc">@maggogerka supporters</text>
    <text x="255" y="22" font-family="Arial" font-size="12" fill="#f85173">OFFLINE</text>
    <rect x="8" y="31" width="304" height="169" rx="12" fill="#161b22"/>
    <text x="160" y="92" text-anchor="middle" font-family="Arial" font-size="20" fill="#f0f6fc">Cached cards stay visible</text>
    <text x="160" y="127" text-anchor="middle" font-family="Arial" font-size="14" fill="#8b949e">Exponential retry is active</text>
    <path d="M160 150c-16-18-43 5 0 38 43-33 16-56 0-38" fill="#f85173"/>
    <text x="160" y="229" text-anchor="middle" font-family="Arial" font-size="11" fill="#2f81f7">github.com/maggogerka</text>
  </g>
  <text x="180" y="322" text-anchor="middle" font-family="Arial" font-size="16" fill="#24292f">Загрузка</text>
  <text x="520" y="322" text-anchor="middle" font-family="Arial" font-size="16" fill="#24292f">Карточка</text>
  <text x="860" y="322" text-anchor="middle" font-family="Arial" font-size="16" fill="#24292f">Offline</text>
